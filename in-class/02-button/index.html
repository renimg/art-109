<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1 id="header">
            Click my Images
        </h1>
    </header>
    <main>
        <div class="box">
            <button id="catimg1">Click here!</button>
            <img src="img/candy.png" alt="Lollipop" class="hidden" id="img1">
        </div>
        <div class="box">
            <button id="catimg2">Click here!</button>
            <img src="img//gem.png" alt="Green Gem" class="hidden" id="img2">
        </div>
        <div class="box">
            <button id="catimg3">Click here!</button>
            <img src="img/pokeball.webp" alt="Pokeball" class="hidden" id="img3">
        </div>
        <div class="box">
            <button id="catimg4">Click here!</button>
            <img src="img/star.png" alt="Star" class="hidden" id="img4">
        </div>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
