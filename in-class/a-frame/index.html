<html>

<head>
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
    <script>
        AFRAME.registerComponent('alpha-test', {
            dependencies: ['material'],
            init: function () {
                this.el.getObject3D('mesh').material.alphaTest = 0.5;
            }
        });
    </script>
</head>

<body>
    <a-scene renderer="sortTransparentObjects: true">
        <a-plane position="0 0 -4" rotation="-90 0 0" width="90" height="90" color="#7BC8A4"></a-plane>
        <a-sky color="#B6C2D9"></a-sky>
        <a-assets>
            <img id="my-image" src="img/Tree_Transparent_Background.png">
            <img id="my-image5" src="img/canva-lush,-full,-ancient-oak-tree-MAG5rnuFKFg.webp">
            <img id="my-image4" src="img/pngtree-tree-picture-png-image_18124597.png">
            <img id="my-image6" src="img/butterfly_2.c1b186a.width-1200.e4133e7.png">
            <img id="my-image2" src="img/flower-10066724_1280.webp">
            <img id="my-image3" src="img/pngtree-yellow-flying-butterfly-png-image_10126607.png">
            <img id="my-image7" src="img/Francis_render_2_full_body_by_kylewithem_dkysysu.webp">
        </a-assets>

        <a-image position="0 3 -5" src="#my-image" rotation="0 0 0" width="4" height="4" side="double"
             alpha-test></a-image>
        <a-image position="0 3 -5" src="#my-image" rotation="0 90 0" width="4" height="4" side="double" alpha-test></a-image>

        <a-image position="3 2 -2" src="#my-image4" rotation="0 0 0" width="4" height="4" alpha-test></a-image>
        <a-image position="3 2 -2" src="#my-image4" rotation="0 90 0" width="4" height="4" alpha-test></a-image>
        <a-image position="-6 2 -3" src="#my-image5" rotation="0 0 0" width="4" height="4" alpha-test></a-image>
        <a-image position="-6 2 -3" src="#my-image5" rotation="0 90 0" width="4" height="4" alpha-test></a-image>

        <a-image position="-2 1 -2" src="#my-image2" rotation="0 35 0" width="0.75" height="1" alpha-test></a-image>
        <a-image position="0.25 2 -2" src="#my-image6" rotation="0 -22 10" width="0.25" height="0.25" alpha-test></a-image>
        <a-image position="-0.25 2 -2" src="#my-image6" rotation="30 -33 10" width="0.25" height="0.25" alpha-test></a-image>
        <a-image position="-1.87 1.3 -1.95" src="#my-image7" rotation="0 0 0" width="0.25" height="0.25" alpha-test></a-image>
    </a-scene>
</body>

</html>
