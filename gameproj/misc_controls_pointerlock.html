<!DOCTYPE html>
<html lang="en">

<head>
	<title>three.js - pointerlock controls</title>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=yes, minimum-scale=1.0, maximum-scale=1.0">
	<style>
		body {
			max-width: 100%;
			max-height: 100%;
		}

		#test {
			width: 100%;
			height: 100%;
			display: flex;
			justify-content: center;
			align-items: center;

		}

		#blocker {
			position: absolute;
			width: 100%;
			height: 100%;
			background-color: rgba(0, 0, 0, 0.5);
		}

		#instructions {
			width: 100%;
			height: 100%;

			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;

			text-align: center;
			font-size: 14px;
			cursor: pointer;
		}
	</style>
</head>

<body>
	<div id="blocker">
		<div id="instructions">
			<p style="font-size:36px">
				Click to play
			</p>
			<p>
				Move: WASD<br />
				Jump: SPACE<br />
				Look: MOUSE
			</p>
		</div>
	</div>

	<script type="importmap">
			{
				"imports": {
					"three": "../gameproj/build/three.module.js",
					"three/addons/": "../gameproj/jsm/"
				}
			}
		</script>

	<div id="test">
		<script type="module">

			import * as THREE from 'three';
			// import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
			import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
			import { Octree } from 'three/addons/math/Octree.js';
			import { Capsule } from 'three/addons/math/Capsule.js';

			let camera, scene, renderer, controls, playerCollider;

			const objects = [];

			let raycaster;

			const collDistance = 0.5;
			const worldOctree = new Octree();

			let moveForward = false;
			let moveBackward = false;
			let moveLeft = false;
			let moveRight = false;
			let canJump = false;

			let prevTime = performance.now();
			const velocity = new THREE.Vector3();
			const direction = new THREE.Vector3();
			const vertex = new THREE.Vector3();
			const color = new THREE.Color();
			const loader = new GLTFLoader();
			const gltf = loader.load('models/mazemodel.glb', (gltf) => {
				scene.add(gltf.scene);
				gltf.scene.position.set(0, 4, 0);
				gltf.scene.updateMatrixWorld(true);
				worldOctree.fromGraphNode(gltf.scene);
			});
			let model = new THREE.Object3D();
			let c, size;
			init();

			function init() {

				camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
				playerCollider = new Capsule(new THREE.Vector3(0, 0.35, 0), new THREE.Vector3(0, 1.35, 0), 0.35
				);
				camera.position.y = 10;

				scene = new THREE.Scene();
				scene.background = new THREE.Color(0xffffff);
				scene.fog = new THREE.Fog(0xffffff, 0, 750);

				const light = new THREE.HemisphereLight(0xeeeeff, 0x777788, 2.5);
				light.position.set(0.5, 1, 0.75);
				scene.add(light);

				controls = new PointerLockControls(camera, document.body);

				const blocker = document.getElementById('blocker');
				const instructions = document.getElementById('instructions');

				instructions.addEventListener('click', function () {

					controls.lock();

				});

				controls.addEventListener('lock', function () {

					instructions.style.display = 'none';
					blocker.style.display = 'none';

				});

				controls.addEventListener('unlock', function () {

					blocker.style.display = 'block';
					instructions.style.display = '';

				});

				scene.add(controls.object);

				const onKeyDown = function (event) {

					switch (event.code) {

						case 'ArrowUp':
						case 'KeyP':
							moveForward = true;
							break;

						case 'ArrowLeft':
						case 'KeyL':
							moveLeft = true;
							break;

						case 'ArrowDown':
						case 'Semicolon':
							moveBackward = true;
							break;

						case 'ArrowRight':
						case 'Quote':
							moveRight = true;
							break;
					}

				};

				const onKeyUp = function (event) {

					switch (event.code) {

						case 'ArrowUp':
						case 'KeyP':
							moveForward = false;
							break;

						case 'ArrowLeft':
						case 'KeyL':
							moveLeft = false;
							break;

						case 'ArrowDown':
						case 'Semicolon':
							moveBackward = false;
							break;

						case 'ArrowRight':
						case 'Quote':
							moveRight = false;
							break;

					}

				};

				document.addEventListener('keydown', onKeyDown);
				document.addEventListener('keyup', onKeyUp);

				raycaster = new THREE.Raycaster(new THREE.Vector3(), new THREE.Vector3(0, -1, 0), 0, 10);
				renderer = new THREE.WebGLRenderer({ antialias: false });
				renderer.setPixelRatio(0.25);
				renderer.setSize(800, 600);
				renderer.setAnimationLoop(animate);
				document.getElementById('test').appendChild(renderer.domElement);


			}

			function animate() {
				const time = performance.now();

				if (controls.isLocked === true) {
					raycaster.ray.origin.copy(controls.object.position);
					raycaster.ray.origin.y -= 10;
					const intersections = raycaster.intersectObjects(objects, false);


					const onObject = intersections.length > 0;

					const delta = (time - prevTime) / 1000;

					velocity.x -= velocity.x * 10.0 * delta;
					velocity.z -= velocity.z * 10.0 * delta;

					velocity.y -= 9.8 * 100.0 * delta; // 100.0 = mass

					direction.z = Number(moveForward) - Number(moveBackward);
					direction.x = Number(moveRight) - Number(moveLeft);
					direction.normalize(); // this ensures consistent movements in all directions

					if (moveForward || moveBackward) velocity.z -= direction.z * 400.0 * delta;
					if (moveLeft || moveRight) velocity.x -= direction.x * 400.0 * delta;

					if (onObject === true) {

						velocity.y = Math.max(0, velocity.y);

					}

					controls.moveRight(- velocity.x * delta);
					controls.moveForward(- velocity.z * delta);

					controls.object.position.y += (velocity.y * delta); // new behavior
					if (controls.object.position.y < 10) {

						velocity.y = 0;
						controls.object.position.y = 10;

					}
					playerCollider.end.copy(controls.object.position);
					const result = worldOctree.capsuleIntersect(playerCollider);
				}

				prevTime = time;

				renderer.render(scene, camera);

			}
		</script>
	</div>
</body>

</html>
